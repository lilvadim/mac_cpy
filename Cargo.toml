[package]
name = "mac_cpy"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Selective macOS backup and restore with direct archive streaming"
license = "BSD-3-Clause"

[dependencies]
ignore = "=0.4.31"
globset = "=0.4.19"
walkdir = "=2.5.0"
libc = "=0.2.189"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = true

